<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Registration Form</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6f8;display:flex;justify-content:center;padding:40px}
.card{background:#fff;padding:24px 28px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.15);width:360px}
h2{text-align:center;color:#1a3a5c}
label{display:block;margin-top:12px;font-weight:bold}
input,select{width:100%;padding:8px;margin-top:4px;box-sizing:border-box}
button{width:100%;margin-top:18px;padding:10px;background:#1a73e8;color:#fff;border:0;border-radius:4px;cursor:pointer}
</style>
</head>
<body>
<div class="card">
<h2>Student Registration</h2>
<form action="/register" method="post">
<label for="studentName">Student Name</label>
<input type="text" id="studentName" name="studentName" required>
<label for="rollNumber">Roll Number</label>
<input type="text" id="rollNumber" name="rollNumber" required>
<label for="email">Email</label>
<input type="email" id="email" name="email" required>
<label for="course">Course</label>
<select id="course" name="course" required>
<option value="">-- Select Course --</option>
<option>B.Tech CSE</option><option>B.Tech ECE</option><option>BCA</option><option>MCA</option><option>MBA</option>
</select>
<button type="submit">Submit</button>
</form>
</div>
</body>
</html>
